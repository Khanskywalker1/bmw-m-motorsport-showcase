name: Verify and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege by default; the deploy job widens it below.
permissions:
  contents: read

# Never let two deploys race. In-progress runs finish rather than being
# cancelled, so a half-uploaded Pages artifact is never published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify:
    name: Typecheck, tests and budgets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Content tests
        run: npm test

      # Chromium for desktop and reduced-motion, WebKit for the iPhone project.
      # The mobile project is WebKit on purpose: svh units and backdrop-filter
      # behave differently there than in Chromium.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      # NOTE: `npm run assets` is deliberately NOT run here. public/media/ is
      # committed, so the build is reproducible offline and CI never hammers
      # BMW's press CDN. Re-run it locally when the manifest changes.
      - name: Build (root path, as the tests expect)
        run: npm run build

      - name: End-to-end tests
        run: npx playwright test

      - name: Performance budgets
        run: npm run check:budget

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  build:
    name: Build for GitHub Pages
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Emits base_path: '/<repo>' for a project site, '' for a user/org site.
      # Reading it here means the repo can be renamed without touching config.
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - run: npm ci

      # A second build, not a wasted one: verify built at the root path so the
      # e2e suite could drive it, and Pages needs the same output rebuilt under
      # the project subpath.
      - name: Build with the Pages base path
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
